presets:
  notes:
    skill: exam-prep-notes
    output: explanation-first course Notes
    actions:
      - process sources once and reuse the fragment index
      - organise connected knowledge units
      - generate the document once
      - run a bounded sanity check
  practice:
    skill: exam-prep-practice
    output: requested question-based artifact
    actions:
      - process course and question sources once
      - run the selected practice capability
      - generate the requested output once
      - run a bounded sanity check
  essay:
    skill: exam-prep-essay
    output: requested essay-support artifact
    actions:
      - analyse the question and evidence once
      - establish Online Essay permissions when needed
      - generate the requested output once
      - run a bounded sanity check
