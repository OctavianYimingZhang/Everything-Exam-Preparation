presets:
  notes:
    skill: exam-prep-notes
    output: explanation-first course Notes
    actions:
      - process sources and slide triage
      - build course coverage audit
      - explain connected knowledge units
      - render and inspect the document
  practice:
    skill: exam-prep-practice
    output: requested question-based artifact
    actions:
      - process course and question sources
      - run the selected practice capability
      - preserve useful provenance
      - verify the output
  essay:
    skill: exam-prep-essay
    output: requested essay-support artifact
    actions:
      - analyse question and course evidence
      - establish Online Essay permissions when needed
      - integrate reliable Extra Reading
      - verify argument and source use
