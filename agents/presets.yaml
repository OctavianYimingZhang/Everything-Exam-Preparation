presets:
  source_inventory_only:
    purpose: "Classify supplied files, source roles, authority, extraction status, and evidence-use limits."
    required_source_classes: ["any_source"]
    modules: ["source_inventory"]
    student_outputs: ["source coverage card"]
  exam_format_diagnosis:
    purpose: "Identify exam mode and route recommendation from formal past papers or explicit user prompt."
    required_source_classes: ["formal_past_papers_or_explicit_prompt"]
    modules: ["source_inventory", "exam_regime", "question_type"]
    student_outputs: ["exam format diagnosis"]
  exam_prep_notes_docx:
    purpose: "Generate the default lecture-first Exam Preparation Notes DOCX from readable course sources."
    required_source_classes: ["readable_course_notes"]
    recommended_source_classes: ["formal_past_papers", "practical_materials", "extra_reading"]
    modules: ["source_inventory", "fragment_index", "lecture_session_mapping", "lecture_concept_module_extraction", "atomic_knowledge_ledger", "source_baseline_notes_plan", "baseline_coverage_floor_qa", "knowledge_only_student_view_filter", "public_lecture_notes_plan", "public_lecture_notes_docx_generation", "public_notes_docx_linter", "exam_prep_notes_linter", "deliverable_qa"]
    student_outputs: ["Lecture Knowledge Walkthrough DOCX"]
  knowledge_walkthrough_docx:
    purpose: "Generate the same public notes artifact with source order treated as the primary ordering signal."
    required_source_classes: ["lecture_or_official_notes"]
    recommended_source_classes: ["formal_past_papers", "practical_materials", "extra_reading"]
    modules: ["source_inventory", "fragment_index", "lecture_session_mapping", "lecture_concept_module_extraction", "public_lecture_notes_plan", "public_lecture_notes_docx_generation", "public_notes_docx_linter", "deliverable_qa"]
    student_outputs: ["Lecture Knowledge Walkthrough DOCX"]
  mcq_exam_prep:
    purpose: "Generate core notes plus MCQ point-card add-on."
    required_source_classes: ["lecture_or_official_notes"]
    recommended_source_classes: ["formal_past_papers", "answer_keys"]
    modules: ["source_inventory", "fragment_index", "atomic_knowledge_ledger", "public_lecture_notes_plan", "public_lecture_notes_docx_generation", "public_notes_docx_linter", "exam_emphasis_profile", "mcq_policy", "mcq_exam_report_docx", "deliverable_qa"]
    student_outputs: ["Lecture Knowledge Walkthrough DOCX", "MCQ Exam Analysis Report DOCX"]
  short_answer_exam_prep:
    purpose: "Generate core notes plus short-answer point cards and Example Answers."
    required_source_classes: ["lecture_or_official_notes"]
    recommended_source_classes: ["formal_past_papers", "answer_keys"]
    modules: ["source_inventory", "fragment_index", "atomic_knowledge_ledger", "public_lecture_notes_plan", "public_lecture_notes_docx_generation", "public_notes_docx_linter", "exam_emphasis_profile", "short_answer_variants", "short_answer_exam_report_docx", "deliverable_qa"]
    student_outputs: ["Lecture Knowledge Walkthrough DOCX", "Short Answer Exam Analysis Report DOCX"]
  long_answer_project_scenario_prep:
    purpose: "Generate core notes plus long-answer/practical/data/problem report with method, readout, control, limitation, and Example Answer logic."
    required_source_classes: ["lecture_or_official_notes"]
    recommended_source_classes: ["practical_materials", "formal_past_papers", "exemplars_or_feedback"]
    modules: ["source_inventory", "fragment_index", "atomic_knowledge_ledger", "public_lecture_notes_plan", "public_lecture_notes_docx_generation", "public_notes_docx_linter", "exam_emphasis_profile", "method_blocks", "long_answer_project_report_docx", "deliverable_qa"]
    student_outputs: ["Lecture Knowledge Walkthrough DOCX", "Long Answer Project Scenario Report DOCX"]
  essay_exam_prep:
    purpose: "Generate core notes plus Essay Module Example Essays DOCX from verified source logic."
    required_source_classes: ["lecture_or_official_notes"]
    recommended_source_classes: ["formal_past_papers", "extra_reading", "exemplars_or_feedback"]
    modules: ["source_inventory", "fragment_index", "atomic_knowledge_ledger", "public_lecture_notes_plan", "public_lecture_notes_docx_generation", "public_notes_docx_linter", "exam_emphasis_profile", "essay_coverage_plan", "citation_resolution", "citation_rendering_gate", "essay_module_example_essays_docx", "deliverable_qa"]
    student_outputs: ["Lecture Knowledge Walkthrough DOCX", "Essay Module Example Essays DOCX"]
  audit_lint_only:
    purpose: "Run source, workflow, language, deliverable, or release checks without generating new student outputs."
    required_source_classes: []
    modules: ["audit"]
    student_outputs: ["QA report"]
  github_ready_qa:
    purpose: "Run repository release checks before publication."
    required_source_classes: []
    modules: ["repository_qa"]
    student_outputs: ["GitHub-ready QA result"]
