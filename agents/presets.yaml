presets:
  exam_prep_notes:
    output: Exam_Preparation_Notes.docx
    options:
      ordering: [exam_emphasis_first, source_order]
      visual_policy: [use_source_visuals_when_helpful, text_only]
  exam_mode_diagnosis:
    output: chat_report
  mcq_addon:
    requires: exam_prep_notes
  short_answer_addon:
    requires: exam_prep_notes
  long_answer_practical_addon:
    requires: exam_prep_notes
  essay_addon:
    requires: exam_prep_notes
