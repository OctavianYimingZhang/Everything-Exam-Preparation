prompt_cards:
  - id: exam_prep_notes
    title: Exam Preparation Notes
    purpose: Review the preliminary route with the user, then build explanation-only Notes with worked examples and separate outputs when Past Paper or Practical material is confirmed.
    route: exam_prep_notes
  - id: exam_mode_diagnosis
    title: Exam Mode Diagnosis
    purpose: Identify how the course is examined, show the preliminary diagnosis, and ask the user to confirm or correct it.
    route: exam_mode_diagnosis
  - id: mcq_preparation
    title: MCQ Exam Type Related Add-on
    purpose: Confirm the MCQ route and source roles, then build a result-only lecture-order report of recurring exam-needed knowledge points from Past Papers and Mock Papers.
    route: mcq_preparation
  - id: short_answer_preparation
    title: Short Answer Exam Type Related Add-on
    purpose: Confirm the Short Answer route and source roles, then build a result-only lecture-order report of recurring exam-needed knowledge points from Past Papers and Mock Papers.
    route: short_answer_preparation
  - id: long_answer_preparation
    title: Long Answer Exam Type Related Add-on
    purpose: Confirm the Long Answer or Practical/Data/Problem route, then build a separate add-on with example answers and academic analysis/prediction results.
    route: long_answer_preparation
  - id: practical_worked_solutions
    title: Detailed Worked Solutions
    purpose: Confirm worked-solution signals, then build a separate DOCX for calculation, derivation, estimate, proof, data, or problem questions.
    route: worked_solution_preparation
  - id: essay_preparation
    title: Essay Exam Type Related Add-on
    purpose: Confirm the Essay route and source roles, then build a separate essay add-on with plans, claims, evidence integration, and example essays.
    route: essay_preparation
