setup_wizard:
  prompts:
    - source_files
    - requested_output
    - exam_mode
    - auto_diagnosis_review
    - material_type_source_roles
    - output_set_confirmation
    - output_depth
    - output_format
    - topic_focus
    - extra_reading_focus
  source_hints:
    purpose: source hints act as open provenance labels
    policy: infer useful source hints from file content when they help routing; confirm Material type and source roles through human review; calibrate notes depth and coverage from confirmed roles, knowledge signals, knowledge density, and knowledge units
  human_review:
    required_before_public_output: true
    plan_title: Auto-diagnosis review plan
    targets:
      - exam_type_route
      - material_type_source_roles
      - output_file_set
  output:
    type: docx_notes
    conditional_addon: exam_type_related_addon_docx_when_past_paper_or_question_practical_material_exists
    conditional_worked_solutions: practical_worked_solutions_docx_when_practical_calculation_problem_material_exists
    naming: user_requested_or_generated_from_context
    student_surface: explanation_only_notes
    formula_policy: domain_neutral_visible_formula_blocks
    visual_policy: academic_cropped_pdf_visual_region_assets
  coverage_calibration:
    basis: open knowledge signals
    signals:
      - topic_boundary
      - learning_objective
      - definition
      - mechanism
      - method
      - comparison
      - calculation
      - data_interpretation
      - evidence
      - application
      - explanatory_example
