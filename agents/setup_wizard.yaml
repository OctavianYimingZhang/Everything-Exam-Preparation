setup_wizard:
  prompts:
    - source_files
    - requested_output
    - exam_mode
    - output_depth
    - output_format
    - topic_focus
    - extra_reading_focus
  source_hints:
    purpose: open provenance labels only
    policy: infer useful source hints from file content when they help routing; calibrate notes length, depth, and coverage from knowledge signals and knowledge units
  output:
    type: docx_notes
    naming: user_requested_or_generated_from_context
    student_surface: knowledge_only_teaching_notes
    formula_policy: visible_formula_blocks
  coverage_calibration:
    basis: open knowledge signals
    signals:
      - topic_boundary
      - learning_objective
      - definition
      - mechanism
      - method
      - comparison
      - calculation
      - data_interpretation
      - evidence
      - application
      - explanatory_example
