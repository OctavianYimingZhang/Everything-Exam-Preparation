name: Everything Exam Preparation
entrypoint: SKILL.md
multi_skill_system:
  enabled: true
  plugin_router_skill: skills/everything-exam-preparation/SKILL.md
  index_skill: skills/exam-prep-index/SKILL.md
  focused_skills:
    - exam-prep-index
    - exam-prep-notes
    - exam-prep-slide-triage
    - exam-prep-mcq
    - exam-prep-short-answer
    - exam-prep-long-answer
    - exam-prep-worked-solutions
    - exam-prep-essay
    - exam-prep-online-essay-exam
    - exam-prep-extra-reading
    - exam-prep-question-solver
    - exam-prep-question-organizer
  removed_focused_skills:
    - exam-prep-exam-mode
default_route: exam_prep_notes
default_output: docx_notes
default_output_language: en
supported_context_versions:
  - 1
academic_task_context_adapter: scripts/soleil_adapter.py
mastery_history:
  default_enabled: true
  scope: per_course
  operations:
    - enable
    - disable
    - export
    - delete
  entrypoint: scripts/mastery_history.py
default_workflow: analyze_all_materials_then_ask_exam_type_and_notes_then_generate_notes_then_specific_research_report
online_essay_exam_workflow: ask_exam_branch_then_online_and_lecture_materials_permissions_then_lock_brief_then_evidence_map_then_planning_approval_then_draft_and_qa
conditional_output: exam_type_related_addon_docx_when_past_paper_or_question_practical_material_exists
conditional_worked_solutions: practical_worked_solutions_docx_when_practical_calculation_problem_material_exists
conditional_question_solution: question_solution_report_when_user_asks_how_to_solve_a_supplied_question
conditional_question_organization: organized_questions_docx_when_user_asks_to_sort_past_paper_or_practice_questions_by_lecture_order
output_name_policy: user-requested filename first; otherwise generate clear distinct DOCX filenames for each output from the source, course, prompt, or note title
language_policy: Default public output is English unless the user explicitly requests Chinese, bilingual, or multiple-language output; bilingual examples are format references only.
human_review:
  required_before_public_output: true
  plan_title: Auto-diagnosis review plan
  prompt: show the automatic diagnosis first, then call request_user_input to confirm Exam type, Material type/source roles, and whether Notes should be generated before generating Notes, Specific Research Reports, add-ons, or worked solutions
  review_targets:
    - Exam type or route
    - Material type or source roles
    - Notes generation choice
    - Online Materials and Lecture Materials permissions for Online Essay Exam
source_hints:
  use: open provenance labels
  coverage_driver: knowledge_signals
  policy: infer useful source hints from content when they help routing, treat them as preliminary until human review, then calibrate public notes coverage from confirmed source roles, knowledge signals, and knowledge units
  examples:
    - course-facing knowledge source
    - practice or question source
    - answer or marking source
    - style or example-answer source
    - extra reading source
    - online material source
    - mixed or unclear source
coverage_calibration:
  unit_basis: connected knowledge signals
  signal_examples:
    - topic_boundary
    - learning_objective
    - definition
    - mechanism
    - method
    - comparison
    - calculation
    - data_interpretation
    - evidence
    - application
    - explanatory_example
student_surface:
  goal: explanation-only teaching Notes that show the lecture and exam-relevant knowledge students need to master, with academic source visuals, calculation worked examples, and Exam Type Related preparation as separate add-on output
  notes_coverage_policy: lecture_unit_complete
  notes_role: broad lecture reconstruction in source order for weakly prepared students
  report_role: concise exam-priority reinforcement from Past Papers, question formats, or route-specific evidence
  content_triage:
    core_lecture_content: cover in Notes
    supporting_example: include when useful and compress when repetitive
    reading_reference: exclude unless directly examinable
    admin_or_boilerplate: exclude unless it changes assessed content
    low_exam_relevance_context: compress or exclude unless it teaches course knowledge
  slide_triage:
    purpose: internal Notes material analysis, not a detail-level grading system or report-priority system
    slide_decision_values:
      - use
      - merge_with_previous
      - exclude
    fields:
      - slide_decision
      - notes_role
      - detailed_explanation_allowed
      - triage_reason
      - slide_triage_audit
    policy: preserve ILO, topic boundary, summary, visual, data, and example slides for structure or merged context when useful, but exclude non-teaching slides from detailed public Notes explanation
  public_content:
    - course knowledge explanation
    - exam-relevant understanding
    - academic source visuals
    - worked examples
    - confirmed Specific Research Report content
    - question solution reports with strict same-knowledge-point transfer practice
    - organized Past Paper and Practice Material question lists
  internal_workflow_record:
    - source intake narration
    - extraction notes
    - coverage calibration narration
    - workflow or QA narration
    - subagent narration
  formula_policy: domain-neutral visible formulas with Word equation or readable Unicode math
  visual_policy: academic cropped PDF visual-region assets and embedded source media when they strengthen a knowledge unit
  worked_example_policy: step-by-step calculation examples when they teach a knowledge unit
  modes:
    - MCQ
    - Short Answer
    - Long Answer
    - Practical/Data/Problem
    - Worked Solutions
    - Essay
    - Online Essay Exam
    - Mixed
    - Question Solving
    - Question Organization
    - Assessment Blueprint
    - Answer Evaluation
    - Timed Practice
mcq_saq_recurrence_policy: MCQ and Short Answer reports are result-only Past Paper-driven recurrence reports. Use Past Papers, Mock Papers, and official exam papers for recurrence; ordinary Practice Material can provide context but does not count. Treat each SAQ subquestion as an independent question record. Public output shows only lecture-order exam-needed knowledge points in the reference-document style, not evidence, calculations, source locators, matching debug, template labels, answer walkthroughs, or Notes-style teaching.
extra_reading_policy: Extra Reading is only used when the confirmed branch includes Essay or Online Essay Exam and source permissions allow it.
online_essay_exam_policy: Online Essay Exam is a parallel branch, not ordinary Essay preparation. Confirm Online Materials and Lecture Materials permissions before any evidence map, plan, Notes, report, or draft; then use locked brief, allowed-source evidence map, paragraph-level plan, CriticalAnalysisPlan, Planning Approval, draft generation, and QA.
question_solver_policy: Use user-supplied material to explain the target question, show the matched knowledge unit, and retrieve strict same-knowledge-point questions.
question_organizer_policy: Generate organized_questions_docx from supplied Past Paper and Practice Material questions sorted by lecture knowledge-unit order, assigning multi-unit questions to the latest matching lecture.
