name: Skill Health

on:
  workflow_dispatch:
  push:
    paths:
      - 'SKILL.md'
      - 'README.md'
      - 'agents/**'
      - 'references/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'skill_manifest.json'
      - '.github/workflows/**'

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m pip install -r requirements.txt
      - run: python3 scripts/github_ready_check.py --ci
