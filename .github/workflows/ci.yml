name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python3 -m pip install --upgrade -r requirements.txt
      - name: Validate Plugin
        run: |
          python3 -m compileall -q scripts
          python3 scripts/validate_skill_contracts.py
          python3 scripts/publish_skill.py --self-test
          python3 scripts/publish_skill.py --local-skill-dir "$RUNNER_TEMP/codex-skills/everything-exam-preparation" --sync-local-skill
          python3 scripts/publish_skill.py --local-skill-dir "$RUNNER_TEMP/codex-skills/everything-exam-preparation" --check-installed
