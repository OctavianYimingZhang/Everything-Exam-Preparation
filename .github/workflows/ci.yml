name: CI

on:
  push:
  pull_request:

jobs:
  skill-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m compileall -q scripts
      - run: python3 scripts/validate_skill_contracts.py --self-test
      - run: python3 scripts/plan_workflow.py --self-test
      - run: python3 scripts/input_readiness_check.py --self-test
      - run: python3 scripts/extract_sources.py --self-test
      - run: python3 scripts/exam_mode_tools.py --self-test
      - run: python3 scripts/generate_exam_prep_notes_docx.py --self-test
      - run: python3 scripts/exam_prep_notes_quality_linter.py --self-test
      - run: python3 scripts/output_sufficiency_linter.py --self-test
      - run: python3 scripts/essay_exam_tools.py --self-test
      - run: python3 scripts/deliverable_surface_linter.py --self-test
      - run: python3 scripts/github_ready_check.py --ci
